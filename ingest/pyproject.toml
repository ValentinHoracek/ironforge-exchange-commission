[project]
name = "ifec-ingest"
version = "0.1.0"
description = "IFEC ingest job: captures WoW Forever auction house snapshots into Bronze"
requires-python = ">=3.12"
dependencies = [
    "azure-identity>=1.27.0",
    "azure-storage-blob>=12.31.1",
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ifec-ingest = "ifec_ingest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ifec_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # asserts and fake credentials are fine in tests
