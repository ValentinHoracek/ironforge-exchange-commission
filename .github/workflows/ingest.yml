# Ingest job: test on every pull request, build the image on pull requests (no push),
# build and publish to GHCR on main. Actions are pinned by commit SHA (supply-chain control).
name: ingest

on:
  pull_request:
    paths: ["ingest/**", ".github/workflows/ingest.yml"]
  push:
    branches: [main]
    paths: ["ingest/**", ".github/workflows/ingest.yml"]
  workflow_dispatch:

permissions: {} # nothing by default; each job asks for what it needs

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/valentinhoracek/ifec-ingest

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest -q

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to GHCR with the short-lived GITHUB_TOKEN; no other credentials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ingest
          push: ${{ github.ref == 'refs/heads/main' }}
          # Deployments use the SHA tag only; "latest" is a convenience for people.
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=ifec-ingest
